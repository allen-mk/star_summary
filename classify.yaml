# 分类说明。命令跑法和技能跑法都读这份文件。
# 没有合适类别时使用「未归类」。不要删掉它。

categories:
  - name: 人工智能
    description: 模型、机器学习、提示词，以及图像、视频等生成式应用。按它是干什么的判断，不按实现语言。以写代码为主要用途的智能体不归这里。
  - name: 编程工具
    description: 编辑器、构建、调试、命令行，以及日常写代码会用到的工具，包括编程智能体。通用编辑器也在这里。
  - name: Web 开发
    description: 浏览器里的应用、前后端框架、网站和 HTTP 接口。游戏和游戏网络不归这里。
  - name: 客户端与界面
    description: 桌面应用、移动应用和界面组件。游戏本体、游戏引擎和代理客户端不归这里。
  - name: 游戏开发
    description: 游戏本体、游戏引擎、游戏服务器和网络同步、地图编辑器，以及明确用于游戏的行为树和热更新。和游戏有关就优先进这里。
  - name: 系统与基础设施
    description: 操作系统、运行时、容器、部署和云，以及网络代理的核心和客户端。
  - name: 数据与存储
    description: 数据库、数据管道、分析和数据采集。爬虫归这里。
  - name: 安全
    description: 认证、加密、漏洞、逆向和开源情报。代理软件和广告过滤规则不归这里。
  - name: 学习与资料
    description: 教程、书籍、手册和资料合集。能运行的软件按用途归类，不放这里。
  - name: 未归类
    description: 没有更合适的类别时放这里。

preferences: ""

hard_rules: |
  以写代码为主要用途的智能体归入编程工具。模型、提示词、图像和视频生成归入人工智能。
  游戏本体、引擎、服务器、地图编辑器和游戏行为树归入游戏开发。
  代理客户端和代理核心都归入系统与基础设施，不归入安全。
  教程、书籍和清单归入学习与资料。能运行的工具按用途归类。
