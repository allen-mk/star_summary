name: Update starred projects

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install .

      - name: Generate
        env:
          # 必须是个人 PAT（public_repo + read:user），不是默认 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.STAR_PAT }}
        run: star-summary generate --format both --output output --no-cache

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "chore: update starred projects"
          git push
