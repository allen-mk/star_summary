[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-summary"
version = "2.0.0"
description = "GitHub 星标项目分类整理工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyGithub>=1.59.1",
    "PyYAML>=6.0",
    "click>=8.1.7",
    "Jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
star-summary = "star_summary.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["star_summary*"]

[tool.setuptools.package-data]
star_summary = ["taxonomy.yaml", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
