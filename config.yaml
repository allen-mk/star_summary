# star-summary 配置
# 所有字段都有默认值，本文件可选。

output:
  format: markdown        # markdown | json | both。默认只生成目录
  base_dir: output        # 输出目录
  markdown_filename: README.md
  json_filename: starred_repos.json
  description_language: zh-cn  # 留空则使用 GitHub 原描述。语言代号如 zh-cn、en

cache:
  enabled: true
  ttl_hours: 24
  cache_dir: .cache

github:
  token_env: GITHUB_TOKEN # Token 从环境变量读取，不写进配置
  timeout: 30
  per_page: 100

logging:
  level: INFO

# 模型接入。地址、密钥和模型名都从环境变量读取，不写进这个文件。
model:
  base_url_env: STAR_SUMMARY_BASE_URL
  api_key_env: STAR_SUMMARY_API_KEY
  model_env: STAR_SUMMARY_MODEL

brief_path: classify.yaml
