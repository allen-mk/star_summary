# star-summary 配置
# 所有字段都有默认值，本文件可选。

output:
  format: markdown        # markdown | json | both
  base_dir: output        # 输出目录
  markdown_filename: README.md
  json_filename: starred_repos.json

cache:
  enabled: true
  ttl_hours: 24
  cache_dir: .cache

github:
  token_env: GITHUB_TOKEN # Token 从环境变量读取，不写进配置
  timeout: 30
  per_page: 100

logging:
  level: INFO
